<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Test Hub</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f8fa;
      color: #14232e;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 48px 32px;
    }

    .eyebrow {
      color: #117478;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 18px 0;
      font-size: clamp(36px, 5vw, 56px);
    }

    header p {
      margin: 0 0 36px;
      color: #65778a;
      font-size: 21px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 380px));
      gap: 22px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 280px;
      padding: 32px;
      border: 1px solid #d6e1eb;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 28px #14232e05;
    }

    .label {
      color: #65778a;
      font-size: 14px;
    }

    h2 {
      margin: 18px 0 12px;
      font-size: 29px;
    }

    .card p {
      margin: 0 0 36px;
      color: #65778a;
      font-size: 17px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: auto;
      padding: 13px 19px;
      border-radius: 8px;
      background: #117478;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .button:hover {
      background: #0c5c60;
    }

    .button:focus-visible {
      outline: 3px solid #117478;
      outline-offset: 4px;
    }

    footer {
      margin-top: 28px;
      color: #65778a;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      main {
        padding: 30px 20px;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">YOUR STUDY SPACE</div>
      <h1>Practice Test Hub</h1>
      <p>Choose a test and start practicing.</p>
    </header>

    <section class="grid" aria-label="Practice tests">
      <article class="card">
        <span class="label">CIS-DF</span>
        <h2>CIS-DF Practice</h2>
        <p>316 questions · Progress tracking</p>
        <a class="button" href="cis-df-practice/index.html">Open test →</a>
      </article>

      <article class="card">
        <span class="label">CIS-DF - NQ1</span>
        <h2>Nightmare questions 1</h2>
        <p>20 questions · Progress tracking</p>
        <a class="button" href="cis-df-nq-1/index.html">Open test →</a>
      </article>
    </section>

    <footer>Pick up where you left off. Progress is saved in your browser.</footer>
  </main>
</body>
</html>
